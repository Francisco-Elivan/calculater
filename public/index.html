<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <!-- O segredo começa aqui: interactive-widget força o redimensionamento correto no mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Área Restrita Acesso Root</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 20px;
      /* Permite rolagem suave se o teclado subir */
      overflow-y: auto; 
    }

    .container {
      /* Removemos o fundo laranja gritante e centralizamos o conteúdo */
      min-height:calc(100dvh - 40px);
      max-width: 500px; /* Evita que o formulário fique esticado demais em telas grandes */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content:center;
       
    }

    h1 {
      color: #00d4ff;
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #2a2a4e;
      display: flex;
      flex-direction: column;
      gap: 24px; /* Cria um espaçamento consistente entre os inputs e o botão */
    }

    .card-erro{
      animation:pulse-border 3s infinite;
    }
  
    .form-grid {
      display: grid;
      grid-template-columns: 1fr; /* Um embaixo do outro fica melhor no mobile */
      gap: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #00d4ff;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f0f23;
      color: #e0e0e0;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00d4ff;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
   
    }

    .btn-primary {
      background: #00d4ff;
      color: #0f0f23;
    }

    .btn-primary:hover {
      background: #1ec9eb;
    }

    .online-users {
      position: absolute; /* Mudado de fixed para absolute para não atrapalhar no mobile */
      top: 20px;
      right: 20px;
      background: #1a1a2e;
      border-radius: 12px;
      padding: 10px 16px;
      border: 1px solid #2a2a4e;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      z-index: 10;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #2ed573;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1 }
      50% { opacity: 0.4 }
    }

     .alerta-caps {
      display: none; /* Oculto por padrão */
      color: #d9534f;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      margin-top: 5px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div class="online-users">
    <div class="online-dot"></div><span id="onlineCount">On</span>
  </div>

  <div class="container">
    <h1>Acesso Restrito</h1>
    <p class="subtitle">Somente o Administrador</p>

    <div class="card">
      
      <div class="form-grid">
        <div class="form-group">
          <label for="Usuario">Usuário</label>
          <!-- type="text" padrão -->
          <input type="text" id="Usuario" placeholder="Digite o usuário" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="Senha">Senha</label>
          <!-- Mudado para type="password" por segurança -->
          <input type="password" id="Senha" placeholder="Digite a senha" required />
        
        </div>
        <div id="avisoCaps" class="alerta-caps">⚠️ Caps Lock ativado!</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="enter()">Acessar Painel</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    const inputUsuario = document.getElementById('Usuario')
    const inputSenha = document.getElementById('Senha');
    const avisoCaps = document.getElementById('avisoCaps');

    function verificarCapsLock(event) {
      // Verifica se o método existe e retorna true/false para CapsLock
      if (event.getModifierState && event.getModifierState('CapsLock')) {
        avisoCaps.style.display = 'block';
      } else {
        avisoCaps.style.display = 'none';
      }
    }

    // Monitora ao pressionar/soltar teclas e ao clicar no campo
    inputSenha.addEventListener('keyup', verificarCapsLock);
    inputSenha.addEventListener('keydown', verificarCapsLock);
    inputSenha.addEventListener('click', verificarCapsLock);

    inputUsuario.addEventListener('keyup',verificarCapsLock);
    inputUsuario.addEventListener('keydown',verificarCapsLock);
    inputUsuario.addEventListener('click',verificarCapsLock);


    // Esconde o aviso quando o usuário sai do campo

    inputUsuario.addEventListener('blur', () => {
      avisoCaps.style.display = 'none';
    });

    inputSenha.addEventListener('blur', () => {
      avisoCaps.style.display = 'none';
    });


  async  function enter() {
     toast()
      // .trim() impede que o usuário envie apenas espaços em branco
      const name = document.getElementById('Usuario').value.trim();
      const pass = document.getElementById('Senha').value.trim();
      if (name === ''){
         alert('preencha o campo Usuario')
         document.getElementById('Usuario').focus()
         
         return;
      }else if(pass === ''){
         alert('preencha o campo Senha')
         document.getElementById('Senha').focus()
         return;
      }
         
     try {
        
         
      const response = await  fetch("http://localhost:3000/api/login",{
         method:"POST",
         headers:{
        "Content-Type":"application/json"
         },
         body:JSON.stringify({name,pass})
      })
      const data = await response.json()
      console.log(data)
     if(!data.status){
      alert(data.messagem)
      return;
     }else{
         document.getElementById('Usuario').value = ''
         document.getElementById('Senha').value = ''
         window.location.href = '/admin.html'
        
     }
    
       } catch (error) {
        alert(error)  
       }  
      
     
    }
  

    // Código bônus: Rola a tela até o botão se o teclado abrir em telas muito pequenas
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
      setTimeout(() => {
          document.querySelector('.btn').scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 300);
      });
    });

 async  function toast(){
   const toast = document.querySelector('.card')
      toast.classList.add(`card-erro`)
     await setTimeout(()=>{
   //   toast.classList.remove('card-erro')
      },500)
   }
  </script>
</body>

</html>
