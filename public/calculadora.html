<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Calculadora</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* ===== HEADER ===== */
    .header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a1a;
      border-bottom: 1px solid #1a1a3a;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #00d4ff;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #888;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4757;
      transition: 0.3s;
    }

    .status-dot.online {
      background: #2ed573;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    /* ===== DISPLAY ===== */
    .display {
      padding: 20px 16px;
      text-align: right;
      background: #0a0a1a;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display-history {
      font-size: 0.9rem;
      color: #b8b4b4;
      min-height: 20px;
      word-break: break-all;
    }

    .display-main {
      font-size: 3rem;
      font-weight: 300;
      color: #fff;
      word-break: break-all;
      line-height: 1.2;
    }

    /* ===== MODO SINAL (overlay quando digitando numero da pergunta) ===== */
  
    .modo-sinal {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      background: rgba(0, 212, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-bottom: 1px solid #00d4ff44;
      transform: translateY(-100%);
      transition: transform 0.3s;
      z-index: 10;
      text-align: center;
    }

    .modo-sinal.show {
      transform: translateY(0);
    }

    .modo-sinal-texto {
      color: #00d4ff;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .modo-sinal-sub {
      color: #888;
      font-size: 0.75rem;
      margin-top: 2px;
    }

    /* ===== CONFIRMACAO DE ENVIO ===== */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      flex-direction: column;
    }

    .confirm-overlay.show {
      display: flex;
    }

    .confirm-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .confirm-text {
      color: #2ed573;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .confirm-sub {
      color: #888;
      font-size: 1rem;
      margin-top: 8px;
    }

    .confirm-vibracoes {
      color: #ffa502;
      font-size: 2rem;
      font-weight: 700;
      margin-top: 12px;
    }

    /* ===== GRID ===== */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #1a1a3a;
      flex: 1;
    }

    .btn-calc {
      background: #12122a;
      border: none;
      color: #e0e0e0;
      font-size: 1.6rem;
      font-weight: 500;
      padding: 20px 8px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-calc:active {
      background: #1a1a4a;
      transform: scale(0.95);
    }

    .btn-calc.numero {
      color: #fff;
    }

    .btn-calc.operador {
      color: #00d4ff;
      background: #0f0f23;
      font-size: 1.8rem;
    }

    .btn-calc.igual {
      background: #00d4ff;
      color: #0f0f23;
      font-weight: 700;
      grid-column: span 2;
    }

    .btn-calc.igual:active {
      background: #33ddff;
    }

    .btn-calc.limpar {
      color: #ff4757;
      background: #0f0f23;
    }

    .btn-calc.zero {
      grid-column: span 2;
    }

    
    .btn-calc.operador.sucesso {
      background: #2ed573 !important;
      color: #0f0f23 !important;
      transition: background 0.3s;
    }

    .btn-calc.operador.erro {
      background: #ff4757 !important;
      color: #fff !important;
      transition: background 0.3s;
    }

    @keyframes confirmPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ===== PAINEL PERGUNTAS ===== */
    .perguntas-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a0a1a;
      border-top: 1px solid #1a1a3a;
      border-radius: 20px 20px 0 0;
      transform: translateY(calc(100% - 50px));
      transition: transform 0.3s;
      z-index: 100;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
    }

    .perguntas-panel.open {
      transform: translateY(0);
    }

    .perguntas-header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid #1a1a3a;
    }

    .perguntas-header h3 {
      color: #00d4ff;
      font-size: 1rem;
    }

    .perguntas-count {
      background: #00d4ff22;
      color: #00d4ff;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .perguntas-lista {
      overflow-y: auto;
      padding: 12px 16px;
      flex: 1;
    }

    .pergunta-card {
      background: #12122a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 3px solid #00d4ff;
    }

    .pergunta-card-numero {
      color: #00d4ff;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .pergunta-card-texto {
      color: #ccc;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .pergunta-card-meta {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      font-size: 0.75rem;
    }

    .meta-vibra {
      background: #ffa50222;
      color: #ffa502;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .meta-resposta {
      background: #2ed57322;
      color: #2ed573;
      padding: 2px 8px;
      border-radius: 8px;
    }

    /* ===== INSTRUCAO ===== */
    .instrucao {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #00d4ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 50;
      pointer-events: none;
    }

    .instrucao.show {
      opacity: 1;
    }

    @media (min-width: 500px) {
      body {
        max-width: 500px;
        margin: 0 auto;
        border-left: 1px solid #1a1a3a;
        border-right: 1px solid #1a1a3a;
      }
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div class="header">
    <div class="header-title">Calculadora</div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Conectando...</span>
    </div>
  </div>



  <div class="display">
    <div class="display-history" id="displayHistory"></div>
    <div class="display-main" id="displayMain">0</div>
  </div>

  <div class="calc-grid">
    <button class="btn-calc limpar" onclick="acaoLimpar()">C</button>
    <button class="btn-calc operador" id="btnDiv" onclick="acaoOperador('/')">÷</button>
    <button class="btn-calc operador" id="btnMul" onclick="acaoOperador('*')">×</button>
    <button class="btn-calc operador" onclick="acaoBackspace()">⌫</button>

    <button class="btn-calc numero" onclick="acaoNumero('7')">7</button>
    <button class="btn-calc numero" onclick="acaoNumero('8')">8</button>
    <button class="btn-calc numero" onclick="acaoNumero('9')">9</button>
    <button class="btn-calc operador " id="btnSub" onclick="acaoOperador('-')">−</button>

    <button class="btn-calc numero" onclick="acaoNumero('4')">4</button>
    <button class="btn-calc numero " onclick="acaoNumero('5')">5</button>
    <button class="btn-calc numero" onclick="acaoNumero('6')">6</button>
    <button class="btn-calc operador" id="btnAdd" onclick="acaoOperador('+')">+</button>
    
    <button class="btn-calc numero" onclick="acaoNumero('1')">1</button>
    <button class="btn-calc numero" onclick="acaoNumero('2')">2</button>
    <button class="btn-calc numero" onclick="acaoNumero('3')">3</button>
    <button class="btn-calc operador" onclick="acaoPonto()">.</button>
    
    <button class="btn-calc numero zero" onclick="acaoNumero('0')">0</button>
    <button class="btn-calc igual" onclick="acaoIgual()">=</button>
  </div>
  
  
  
  
  <script>




    // ===== ESTADO =====
    let display = '0', history = '', operacao = null, anterior = null, novaEntrada = true;
    let socket, perguntas = [];
    let modoSinalAtivo = false;
    let numeroPerguntaDigitado = '';

    // ===== SOCKET =====
    function conectarSocket() {
      socket = io();
      socket.on('connect', () => {
        document.getElementById('statusDot').classList.add('online');
        document.getElementById('statusText').textContent = 'Online';
      });
      socket.on('disconnect', () => {
        document.getElementById('statusDot').classList.remove('online');
        document.getElementById('statusText').textContent = 'Offline';
      });
      socket.on('vibrar', (data) => {
        executarVibracao(data.vibracoes, data.numero);
      });
      socket.on('resposta-consulta', (data) => {
        if (data.sucesso) {
          mostrarConfirmacao(data.numero, data.vibracoes, data.operador);
        } else {

          mostrarErroOperador(data.operador, data.mensagem);
        }
      });
      socket.on('perguntas-atualizadas', (novas) => {
        perguntas = novas;

      });
    }

    // ===== VIBRACAO =====
    function executarVibracao(vezes, numero) {
      const padrao = [];
      for (let i = 0; i < vezes; i++) {
        padrao.push(300);
        if (i < vezes - 1) padrao.push(1000);
      }
      if ('vibrate' in navigator) navigator.vibrate(padrao);

      const toast = document.getElementById('toast');
      toast.className = 'toast vibrando show';
      toast.textContent = `${vezes} vibracao(oes) recebidas! Pergunta #${numero}`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ===== CALCULADORA FUNCIONAL =====
    function atualizarDisplay() {
      document.getElementById('displayMain').textContent = display;
      document.getElementById('displayHistory').textContent = history;
    }
    function acaoNumero(num) {
      // Se estamos em modo sinal, acumula o numero da pergunta
      if (modoSinalAtivo) {
        numeroPerguntaDigitado += num;
        display = numeroPerguntaDigitado;
        atualizarDisplay();
        return;
      }  
   
      
      // Calculadora normal
      if (novaEntrada) {
        display = num;
       
        novaEntrada = false;
      } else {
        display = display === '0' ? num : display + num;
      }
      atualizarDisplay();
    }

    function acaoOperador(op) {
      // Se temos um numero de pergunta digitado, envia sinal
      if (modoSinalAtivo && numeroPerguntaDigitado) {
        enviarSinal(numeroPerguntaDigitado, op);
       
        return;
      }
      
   
      // Verifica se o display tem apenas numeros (possivel pergunta)
      if (/^\d+$/.test(display) && display !== '0') {
        // Ativa modo sinal
        modoSinalAtivo = true;
        numeroPerguntaDigitado = display;
     

        // Destaca o operador pressionado como "confirmando"
        const btnId = op === '+' ? 'btnAdd' : op === '-' ? 'btnSub' : op === '*' ? 'btnMul' : 'btnDiv';
        const btn = document.getElementById(btnId);
        btn.classList.add('confirmando');

        // Envia para o servidor
        enviarSinal(numeroPerguntaDigitado, op);
      
      }

      // Calculadora normal
      if (op === '.' || display === '0')return
      
      if (anterior !== null && !novaEntrada) 
      calcsular();
      operacao = op;
      anterior = parseFloat(display);
      history = display + ' ' + op;
      novaEntrada = true;
      modoSinalAtivo = false;
      display = anterior  
      atualizarDisplay();
    }

    function acaoIgual() {
  
      // Se estiver em modo sinal, cancela
      if (modoSinalAtivo) {
        cancelarModoSinal();
        return;
      }
      if (operacao && anterior !== null) {
        calcular();
        history = '';
        operacao = null;
        anterior = null;
        novaEntrada = true;
        atualizarDisplay();
      }
    }

    function calcular() {
      const atual = parseFloat(display);
     
      let resultado = anterior;
      switch (operacao) {
        case '+': resultado = anterior + atual; break;
        case '-': resultado = anterior - atual; break;
        case '*': resultado = anterior * atual; break;
        case '/': resultado = atual !== 0 ? anterior / atual : 'Erro'; break;
      }
      display = String(resultado);
      history = '';
    }

    function acaoLimpar() {
      if (modoSinalAtivo) {
        cancelarModoSinal();
        return;
      }
      display = '0';
      history = '';
      operacao = null;
      anterior = null;
      novaEntrada = true;
      atualizarDisplay();
    }

    function acaoBackspace() {
      if (modoSinalAtivo) {
        numeroPerguntaDigitado = numeroPerguntaDigitado.slice(0, -1);
        display = numeroPerguntaDigitado || '0';
        atualizarDisplay();
        if (!numeroPerguntaDigitado) cancelarModoSinal();
        return;
      }
      if (display.length > 1) {
        display = display.slice(0, -1);
      } else {
        display = '0';
        novaEntrada = true;
      }
      atualizarDisplay();
    }

    function acaoPonto() {
      if (modoSinalAtivo) return; // Nao permite ponto em modo sinal
      if (!display.includes('.')) {
        display += '.';
        atualizarDisplay();
      }
    }

    // ===== MODO SINAL =====
    function cancelarModoSinal() {
      modoSinalAtivo = false;
      numeroPerguntaDigitado = '';

      // Reseta cores dos operadores
      document.querySelectorAll('.btn-calc.operador').forEach(b => {
        b.classList.remove('confirmando', 'sucesso', 'erro');
      });
      //display = '0';
      atualizarDisplay();
    }

    function enviarSinal(numero, operador) {
      socket.emit('consultar-pergunta', {
        numeroPergunta: parseInt(numero),
        operador: operador
      });
    }

    async function mostrarConfirmacao(numero, vibracoes, operador) {
      const btnId = operador === '+' ? 'btnAdd' : operador === '-' ? 'btnSub' : operador === '*' ? 'btnMul' : 'btnDiv';
      const btn = document.getElementById(btnId);

      btn.classList.add('sucesso');

      await setTimeout(() => {
        cancelarModoSinal();
      }, 2000);
    }

    async function mostrarErroOperador(operador, mensagem) {
      const btnId = operador === '+' ? 'btnAdd' : operador === '-' ? 'btnSub' : operador === '*' ? 'btnMul' : 'btnDiv';
      const btn = document.getElementById(btnId);

      btn.classList.add('erro');

      await setTimeout(() => {
        cancelarModoSinal();

      }, 2000);
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      conectarSocket();
    });

    // Previne zoom double-tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, false);
  </script>
</body>

</html>
